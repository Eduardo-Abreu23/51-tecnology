<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="css/produtos.css">
<link rel="stylesheet" href="css/product-card.css">
</helmet>
<div class="product-card">
  <div class="product-card__media" data-product="{{p.id}}" data-color="{{p.colorId}}">
    <div onClick="{{p.onOpen}}" onMouseMove="{{p.tiltMove}}" onMouseLeave="{{p.tiltLeave}}" class="product-card__open">
      <sc-if value="{{p.hasImg}}" hint-placeholder-val="{{false}}">
        <img loading="lazy" data-tilt="" src="{{p.img}}" alt="{{p.name}}" class="product-card__img {{p.imgCls}}">
      </sc-if>
      <sc-if value="{{p.noImg}}" hint-placeholder-val="{{true}}">
        <div data-tilt="" class="product-card__ph">
          <span class="product-card__ghost" data-color="{{p.colorId}}">{{p.ghost}}</span>
          <span class="product-card__ph-label">Foto do produto</span>
        </div>
      </sc-if>
    </div>
    <div class="product-card__badges">
      <sc-if value="{{p.isOffer}}" hint-placeholder-val="{{false}}">
        <span class="product-card__badge product-card__badge--offer">OFERTA</span>
        <span class="product-card__badge product-card__badge--disc">{{p.discTxt}}</span>
      </sc-if>
    </div>
    <div class="product-card__tools">
      <button onClick="{{p.onFav}}" aria-label="Favoritar" class="product-card__tool">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linejoin="round" class="product-card__heart {{p.favCls}}"><path d="M12 20.5s-7.5-4.4-9.6-9.2C1 7.9 3.1 4.5 6.6 4.5c2.2 0 3.9 1.2 5.4 3 1.5-1.8 3.2-3 5.4-3 3.5 0 5.6 3.4 4.2 6.8-2.1 4.8-9.6 9.2-9.6 9.2z"></path></svg>
      </button>
      <button onClick="{{p.onOpen}}" aria-label="Ver detalhes" class="product-card__tool">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
  </div>
  <div class="product-card__body">
    <div class="product-card__kicker">{{p.brand}} · {{p.sub}}</div>
    <button onClick="{{p.onOpen}}" class="product-card__name">{{p.name}}</button>
    <div class="product-card__rating">
      <span class="product-card__stars">★★★★★<span class="product-card__stars-fill" data-stars="{{p.stars}}">★★★★★</span></span>
      <span>{{p.ratingTxt}}</span>
    </div>
    <sc-if value="{{p.hasColors}}" hint-placeholder-val="{{false}}">
      <div class="product-card__colors">
        <sc-for list="{{p.colors}}" as="c" hint-placeholder-count="3">
          <button onClick="{{c.onPick}}" aria-label="{{c.name}}" title="{{c.name}}" class="product-card__color {{c.cls}}"><span class="product-card__color-dot" data-color="{{c.id}}"></span></button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{p.showUrgency}}" hint-placeholder-val="{{false}}">
      <div class="product-card__urgency"><span class="product-card__urgency-dot"></span>Poucas unidades</div>
    </sc-if>
    <div class="product-card__prices">
      <sc-if value="{{p.hasOld}}" hint-placeholder-val="{{false}}">
        <div class="product-card__old-row"><span class="product-card__old">{{p.oldTxt}}</span><span class="product-card__disc">{{p.discTxt}}</span></div>
      </sc-if>
      <div class="product-card__price">{{p.priceTxt}}</div>
      <div class="product-card__install">{{p.installTxt}}</div>
    </div>
    <button onClick="{{p.onAdd}}" class="product-card__add {{p.addCls}}">{{p.addLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:520},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
